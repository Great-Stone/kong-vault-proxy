_format_version: "3.0"
_workspace: kong-vault-proxy

upstreams:
  - name: vault-cluster
    tags: [plugin-demo]
    algorithm: round-robin
    slots: 10000
    healthchecks:
      active:
        type: http
        # Kong http_path cannot include query strings; treat standby/perf-standby codes as healthy.
        http_path: /v1/sys/health
        healthy:
          interval: 2
          successes: 1
          http_statuses: [200, 429, 472, 473]
        unhealthy:
          interval: 2
          http_failures: 1
          tcp_failures: 1
          timeouts: 1
          http_statuses: [500, 501, 502, 503, 474, 530]
      passive:
        type: http
        healthy:
          successes: 1
          http_statuses: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226, 429, 472, 473]
        unhealthy:
          http_failures: 1
          timeouts: 1
          http_statuses: [500, 503, 474, 530]
    targets:
      - target: vault-1:8200
        weight: 100
        tags: [plugin-demo]
      - target: vault-2:8200
        weight: 100
        tags: [plugin-demo]
      - target: vault-3:8200
        weight: 100
        tags: [plugin-demo]

services:
  - name: kong-vault-proxy-vault
    host: vault-cluster
    port: 8200
    protocol: http
    path: /v1
    tags: [plugin-demo]
    routes:
      - name: kong-vault-proxy-internal-app
        tags: [plugin-demo]
        paths:
          - /app
        strip_path: true
        methods:
          - GET
          - OPTIONS
        protocols:
          - http
          - https
        plugins:
          - name: key-auth
            tags: [plugin-demo]
          - name: acl
            tags: [plugin-demo]
            config:
              allow: [app]
      - name: kong-vault-proxy-app-a
        tags: [plugin-demo]
        paths:
          - /secret/data/app-a
        strip_path: false
        methods:
          - GET
          - PUT
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        plugins:
          - name: key-auth
            tags: [plugin-demo]
          - name: acl
            tags: [plugin-demo]
            config:
              allow: [app-a]
      - name: kong-vault-proxy-app-b
        tags: [plugin-demo]
        paths:
          - /secret/data/app-b
        strip_path: false
        methods:
          - GET
          - OPTIONS
        protocols:
          - http
          - https
        plugins:
          - name: key-auth
            tags: [plugin-demo]
          - name: acl
            tags: [plugin-demo]
            config:
              allow: [app-b]
      - name: kong-vault-proxy-cache-clear
        tags: [plugin-demo]
        paths:
          - /kong-vault-proxy/v1/cache-clear
        strip_path: false
        methods:
          - POST
          - OPTIONS
        protocols:
          - http
          - https
        plugins:
          - name: key-auth
            tags: [plugin-demo]
          - name: acl
            tags: [plugin-demo]
            config:
              allow: [app-a]
    plugins:
      - name: cors
        tags: [plugin-demo]
        config:
          origins:
            - "*"
          methods:
            - GET
            - PUT
            - POST
            - OPTIONS
          headers:
            - apikey
            - Content-Type
            - X-Vault-Token
            - X-Vault-Request
            - X-Kong-Vault-Proxy-Bypass-Cache
          exposed_headers:
            - X-Kong-Vault-Proxy-Cache
            - X-Kong-Vault-Proxy-Vault
          credentials: false
          max_age: 3600
      - name: kong-vault-proxy
        tags: [plugin-demo]
        config:
          token_mode: force
          auth_method: approle
          approle_auth_path: approle
          approle_role_id: ${{ env "DECK_VAULT_ROLE_ID" }}
          approle_secret_id_file: /run/kong-vault-proxy/approle_secret_id
          require_vault_request_header: true
          enable_cache_clear: true
          cache_clear_path: /kong-vault-proxy/v1/cache-clear
          vault_addrs:
            - vault-1:8200
            - vault-2:8200
            - vault-3:8200
          vault_scheme: http
          tls_verify: false
          cacheable_methods:
            - GET
          cache:
            enabled: true
            strategy: memory
            kv_min_cache_ttl: 5
            default_ttl: 30
            neg_ttl: 2
            memory:
              dictionary_name: kong_vault_proxy_cache

consumers:
  - username: vault-app-a
    tags: [plugin-demo]
    keyauth_credentials:
      - key: vault-app-a-key
        tags: [plugin-demo]
    acls:
      - group: app-a
        tags: [plugin-demo]
  - username: vault-app-b
    tags: [plugin-demo]
    keyauth_credentials:
      - key: vault-app-b-key
        tags: [plugin-demo]
    acls:
      - group: app-b
        tags: [plugin-demo]
  - username: vault-app
    tags: [plugin-demo]
    keyauth_credentials:
      - key: vault-app-key
        tags: [plugin-demo]
    acls:
      - group: app
        tags: [plugin-demo]
